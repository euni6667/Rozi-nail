<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#f4f0eb"><link rel="manifest" href="manifest.webmanifest"><title>ROZI 美甲計費</title><style>
:root{--bg:#f4f0eb;--card:#fff;--ink:#332c28;--muted:#8b817b;--accent:#8a6e62;--line:#e9dfda;--soft:#f8f5f2;--danger:#b14f4f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'PingFang TC',sans-serif;color:var(--ink)}main{max-width:680px;margin:auto;padding:18px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin:6px 2px 14px}.top h1{font-size:23px;margin:0}.pill,.hint{font-size:12px;color:var(--muted)}.card{background:var(--card);border-radius:20px;padding:17px;margin:11px 0;box-shadow:0 3px 18px #6d4d3b0d}.hero{background:#302a27;color:#fff}.hero .big{font-size:35px;font-weight:800;margin:5px 0}.hero small{color:#d7ccc6}.grid,.row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#fbf8f6;border-radius:14px;padding:12px}.stat b{display:block;font-size:19px;margin-top:4px}label{display:block;font-size:13px;color:var(--muted);margin:11px 0 6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;color:var(--ink)}textarea{min-height:65px}.btn{width:100%;border:0;border-radius:14px;padding:14px;background:var(--accent);color:#fff;font-weight:700;margin-top:13px}.btn.secondary{background:#eee6e2;color:var(--ink)}.btn.danger{background:#fff0f0;color:var(--danger)}nav{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}nav div{max-width:680px;width:100%;display:grid;grid-template-columns:repeat(4,1fr)}nav button{border:0;background:none;padding:12px 4px;color:var(--muted);font-size:12px}nav button.active{color:var(--accent);font-weight:700}.page{display:none}.page.active{display:block}.record{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:8px}.record small{color:var(--muted)}.money{font-weight:800}.empty{text-align:center;color:var(--muted);padding:22px}.progress{height:8px;background:#eee6e2;border-radius:99px;overflow:hidden;margin:10px 0}.progress i{display:block;height:100%;background:#b89b8d;width:0}.tabs{display:flex;gap:7px;overflow:auto;padding:2px 0 8px}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;color:var(--muted)}.tabs button.on{background:#302a27;color:#fff;border-color:#302a27}.items{display:grid;gap:8px}.item{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;text-align:left;display:flex;justify-content:space-between;gap:8px}.item.selected{outline:2px solid #a98878;background:#fbf7f4}.item span{color:var(--muted);font-size:12px}.qty{display:grid;grid-template-columns:1fr 88px;gap:8px;align-items:end}.totalbox{background:#302a27;color:white;border-radius:16px;padding:15px;margin-top:13px;display:flex;justify-content:space-between;align-items:center}.totalbox b{font-size:25px}.chosen{font-size:12px;color:var(--muted);line-height:1.6;margin-top:8px}.date-display{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft);font-weight:700}.time-slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.time-slot{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px 6px;color:var(--ink)}.time-slot.on{background:#302a27;color:#fff;border-color:#302a27}
</style></head><body><main><div class="top"><h1>ROZI 美甲計費</h1><span class="pill" id="today"></span></div>
<section id="home" class="page active"><div class="card hero"><small>本月總業績</small><div class="big" id="monthTotal">$0</div><small id="tierText"></small><div class="progress"><i id="prog"></i></div><small id="nextText"></small></div><div class="grid"><div class="stat">今日業績<b id="dayTotal">$0</b></div><div class="stat">本月客數<b id="monthCount">0</b></div><div class="stat">預估薪資<b id="salary">$1,500</b></div><div class="stat">平均客單<b id="avg">$0</b></div></div><div class="card"><b>最近紀錄</b><div id="recent"></div></div></section>
<section id="add" class="page"><div class="card"><h2>新增計費</h2><label>預約日期</label><div class="date-display" id="dateDisplay"></div><input id="date" type="hidden"><label>預約時段</label><div class="time-slots" id="timeSlots"><button type="button" class="time-slot" data-time="10:00">10:00</button><button type="button" class="time-slot" data-time="13:00">13:00</button><button type="button" class="time-slot" data-time="16:00">16:00</button><button type="button" class="time-slot" data-time="19:00">19:00</button><button type="button" class="time-slot" data-time="加開時段">加開時段</button></div><input id="time" type="hidden"><label>客人姓名／暱稱</label><input id="client" placeholder="可不填"><label>選擇價目</label><div class="tabs" id="tabs"></div><div class="items" id="items"></div><div id="unitWrap" style="display:none"><div class="qty"><div><label id="qtyLabel">數量</label><input id="qty" type="number" min="1" value="1" inputmode="numeric"></div><div><label>單價</label><input id="unitPrice" type="number" inputmode="numeric"></div></div></div><label>自訂加減金額</label><input id="adjust" type="number" inputmode="numeric" value="0" placeholder="折扣可輸入負數"><div class="chosen" id="chosen"></div><div class="totalbox"><span>本次業績</span><b id="calcTotal">$0</b></div><label>額外收入（不計業績，直接加入薪資）</label><input id="extra" type="number" inputmode="numeric" min="0" value="0"><label>備註</label><textarea id="note" placeholder="款式、顏色、客人需求…"></textarea><button class="btn" id="save">完成並記錄</button><button class="btn secondary" id="reset">清除本次選擇</button></div></section>
<section id="records" class="page"><div class="card"><h2>業績紀錄</h2><label>查看月份</label><input type="month" id="filterMonth"><div id="list"></div></div></section>
<section id="settings" class="page"><div class="card"><h2>薪資規則</h2><div class="hint">總業績 ≤60,000：45%｜60,001–70,000：50%｜70,001–80,000：55%｜80,001–90,000：60%｜90,001–100,000：65%｜超過 100,000：前 10 萬 ×65%，超過部分 ×80%｜每月勞健保補貼 $1,500</div></div><div class="card"><h2>資料備份</h2><button class="btn secondary" id="export">匯出備份</button><label>匯入備份 JSON</label><input type="file" id="import" accept=".json,application/json"><button class="btn danger" id="clear">清除全部資料</button><p class="hint">資料儲存在此瀏覽器本機，建議定期備份。</p></div></section>
</main><nav><div><button data-p="home" class="active">首頁</button><button data-p="add">＋ 計費</button><button data-p="records">紀錄</button><button data-p="settings">設定</button></div></nav><script>
const PRICE={
'基礎項目':[['清新造型',1380],['輕奢造型',1580],['藝術造型',1780,'起']],
'經典項目':[['精緻單色',1080],['貓眼碎鑽',1080],['鏡面造型',1280],['無痕漸層',1280],['微笑法式',1480],['精緻排鑽',250,'每指，250–400']],
'卸甲／延甲':[['本店卸甲不續作',400],['他店卸甲不續作',600],['加購透明凝膠',200],['凝膠延甲',100,'每指'],['本店延甲續用',30,'每指'],['他店延甲續用',50,'每指'],['纖維補甲',30,'每指'],['甲型重塑',50,'每指'],['玻璃纖維捲甲矯型',500,'每指']],
'保養項目':[['手部基礎護理',680],['嫩白深層角質護理',1080],['足部淨嫩基礎護理',1080],['足部煥采嫩白深層角質護理',1480],['保養加購透明凝膠',200],['凝膠造型加購深層護理',-500,'折扣']],
'造型單指':[['單色',150,'每指'],['貓眼',150,'每指'],['碎鑽',150,'每指'],['鏡面造型',150,'每指'],['無痕漸層',150,'每指'],['弧形微笑法式',200,'每指'],['彩繪',250,'每指，250–400'],['施華洛世奇鑽',30,'每顆，30–70'],['施華洛世奇大鑽球',250,'每顆，250–350']]
};
const $=id=>document.getElementById(id),fmt=n=>'$'+Math.round(n).toLocaleString('zh-TW'),iso=d=>{let z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)},esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=JSON.parse(localStorage.getItem('rozi_nail_records')||'[]'),selected=[],cat=Object.keys(PRICE)[0],pending=null;const now=new Date();$('today').textContent=now.toLocaleDateString('zh-TW',{month:'long',day:'numeric',weekday:'short'});$('date').value=iso(now);$('dateDisplay').textContent=now.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});$('time').value='';document.querySelectorAll('.time-slot').forEach(b=>b.onclick=()=>{document.querySelectorAll('.time-slot').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('time').value=b.dataset.time});$('filterMonth').value=iso(now).slice(0,7);
function rate(t){if(t<=60000)return .45;if(t<=70000)return .50;if(t<=80000)return .55;if(t<=90000)return .60;return .65}function salary(t,e){return t<=100000?t*rate(t)+e+1500:65000+(t-100000)*.8+e+1500}function monthData(m){return data.filter(x=>x.date.slice(0,7)===m)}
function renderPrice(){ $('tabs').innerHTML=Object.keys(PRICE).map(x=>`<button class="${x===cat?'on':''}" onclick="setCat('${x}')">${x}</button>`).join('');$('items').innerHTML=PRICE[cat].map((x,i)=>`<button class="item" onclick="pick('${cat}',${i})"><b>${x[0]}</b><span>${x[2]||''} ${fmt(x[1])}</span></button>`).join('') }window.setCat=x=>{cat=x;renderPrice()};window.pick=(c,i)=>{let x=PRICE[c][i], variable=x[2]&&(/每指|每顆|起|250–|30–/.test(x[2]));pending={name:x[0],price:x[1],note:x[2]||'',variable};if(variable){$('unitWrap').style.display='block';$('qty').value=1;$('unitPrice').value=x[1];$('qtyLabel').textContent=x[2].includes('每顆')?'顆數':x[2].includes('每指')?'指數':'數量';}else{selected.push({name:x[0],amount:x[1]});pending=null;$('unitWrap').style.display='none';calc()} };
function calc(){if(pending){let q=Math.max(1,Number($('qty').value)||1),p=Number($('unitPrice').value)||0;let idx=selected.findIndex(x=>x.pending);if(idx>=0)selected.splice(idx,1);selected.push({name:pending.name+' × '+q,amount:q*p,pending:true})}let base=selected.reduce((a,x)=>a+x.amount,0),adj=Number($('adjust').value)||0,total=Math.max(0,base+adj);$('calcTotal').textContent=fmt(total);$('chosen').innerHTML=selected.filter(x=>!x.pending||pending).map(x=>`${esc(x.name)} ${fmt(x.amount)}`).join(' ＋ ')+(adj?` ${adj>0?'＋':'−'} ${fmt(Math.abs(adj))}`:'');return total}$('qty').oninput=calc;$('unitPrice').oninput=calc;$('adjust').oninput=calc;
function resetBill(){selected=[];pending=null;$('unitWrap').style.display='none';$('adjust').value=0;$('extra').value=0;$('note').value='';$('chosen').textContent='';$('calcTotal').textContent='$0'}$('reset').onclick=resetBill;
function render(){let m=iso(new Date()).slice(0,7),md=monthData(m),total=md.reduce((a,x)=>a+x.amount,0),extra=md.reduce((a,x)=>a+(x.extra||0),0),today=iso(new Date()),dt=md.filter(x=>x.date===today).reduce((a,x)=>a+x.amount,0);$('monthTotal').textContent=fmt(total);$('dayTotal').textContent=fmt(dt);$('monthCount').textContent=md.length;$('avg').textContent=fmt(md.length?total/md.length:0);$('salary').textContent=fmt(salary(total,extra));$('tierText').textContent=total>100000?'超過 10 萬部分抽成 80%':'目前抽成 '+rate(total)*100+'%';let th=[60001,70001,80001,90001,100001],next=th.find(x=>total<x);$('nextText').textContent=next?'距下一級還差 '+fmt(next-total):'已進入 10 萬以上 80% 區間';$('prog').style.width=Math.min(100,total/100000*100)+'%';let recent=[...data].sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time)).slice(0,5);$('recent').innerHTML=recent.length?recent.map(x=>`<div class="record"><div><b>${esc(x.client||x.service||'未命名')}</b><br><small>${x.date} ${x.time||''}<br>${esc(x.service||'')}</small></div><div class="money">${fmt(x.amount)}</div></div>`).join(''):'<div class="empty">還沒有紀錄</div>';renderList()}
function renderList(){let arr=monthData($('filterMonth').value).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));$('list').innerHTML=arr.length?arr.map(x=>`<div class="record"><div><b>${esc(x.client||'未命名客人')}</b><br><small>${x.date} ${x.time||''}<br>${esc(x.service||'自訂')}${x.note?' · '+esc(x.note):''}${x.extra?'<br>額外收入 '+fmt(x.extra):''}</small></div><div><div class="money">${fmt(x.amount)}</div><button onclick="del('${x.id}')" style="border:0;background:none;color:#b14f4f;padding:5px 0">刪除</button></div></div>`).join(''):'<div class="empty">這個月沒有紀錄</div>'}window.del=id=>{if(confirm('確定刪除此筆紀錄？')){data=data.filter(x=>x.id!==id);persist()}};function persist(){localStorage.setItem('rozi_nail_records',JSON.stringify(data));render()}
$('save').onclick=()=>{let amount=calc();if(!$('time').value)return alert('請先選擇預約時段');if(!amount)return alert('請先選擇項目或輸入金額');let service=selected.map(x=>x.name).join('、')+(Number($('adjust').value)?'、自訂調整':'');data.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),date:$('date').value,time:$('time').value,client:$('client').value.trim(),service,amount,extra:Number($('extra').value)||0,note:$('note').value.trim()});persist();$('client').value='';$('time').value='';document.querySelectorAll('.time-slot').forEach(x=>x.classList.remove('on'));resetBill();go('home')};$('filterMonth').onchange=renderList;document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));window.scrollTo(0,0)}
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),records:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rozi-nail-backup-'+iso(new Date())+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};$('import').onchange=e=>{let f=e.target.files[0];if(!f)return;let rd=new FileReader();rd.onload=()=>{try{let j=JSON.parse(rd.result),r=Array.isArray(j)?j:j.records;if(!Array.isArray(r))throw 0;if(confirm('匯入會取代目前資料，確定嗎？')){data=r;persist()}}catch{alert('備份檔格式不正確')}};rd.readAsText(f)};$('clear').onclick=()=>{if(confirm('確定清除全部紀錄？')){data=[];persist()}};renderPrice();render();
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }
</script></body></html>
